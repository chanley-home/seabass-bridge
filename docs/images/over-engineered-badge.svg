<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Over Engineered - seabass-bridge</title>
  <desc id="desc">A blue and gold engineering-style award ribbon for the seabass-bridge project.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b4ca1"/>
      <stop offset="1" stop-color="#06275a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a1"/>
      <stop offset=".45" stop-color="#d9a514"/>
      <stop offset="1" stop-color="#8c5c00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8ced8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- gear -->
  <g transform="translate(600 180)" filter="url(#shadow)">
    <circle r="135" fill="url(#gold)" stroke="#06275a" stroke-width="8"/>
    <circle r="105" fill="#0a326d" stroke="#f5ca48" stroke-width="8"/>
    <circle r="78" fill="none" stroke="#7fb4ff" stroke-width="3" stroke-dasharray="8 8" opacity=".7"/>
    <path d="M0-156 18-132 48-145 55-116 88-116 85-84 115-73 99-46 127-27 106-5 130 19 102 35 115 65 84 72 87 105 55 103 45 134 17 121 0 151-18 124-48 138-55 106-88 108-85 75-115 67-99 38-127 21-106-3-130-26-102-43-115-73-84-80-87-112-55-110-45-141-17-128Z"
          fill="none" stroke="url(#gold)" stroke-width="18" stroke-linejoin="round"/>
    <circle cy="-128" r="13" fill="url(#gold)" stroke="#4d3300" stroke-width="4"/>
    <circle cy="128" r="13" fill="url(#gold)" stroke="#4d3300" stroke-width="4"/>
  </g>

  <!-- ribbon tails -->
  <path d="M40 175 210 140 260 205 195 252 120 242 58 286 74 216Z"
        fill="url(#blue)" stroke="url(#gold)" stroke-width="10"/>
  <path d="M1160 175 990 140 940 205 1005 252 1080 242 1142 286 1126 216Z"
        fill="url(#blue)" stroke="url(#gold)" stroke-width="10"/>

  <!-- main banner -->
  <path d="M110 116 Q600 58 1090 116 L1050 242 Q600 194 150 242Z"
        fill="url(#blue)" stroke="url(#gold)" stroke-width="12" filter="url(#shadow)"/>

  <!-- blueprint details -->
  <g stroke="#8ec5ff" fill="none" opacity=".45" stroke-width="2">
    <path d="M180 160 H1020"/>
    <path d="M205 214 H995"/>
    <circle cx="190" cy="185" r="22"/>
    <path d="M168 185h44M190 163v44"/>
    <circle cx="1010" cy="185" r="22"/>
    <path d="M988 185h44M1010 163v44"/>
    <path d="M320 130 q280-55 560 0" stroke-dasharray="10 8"/>
  </g>

  <!-- headline -->
  <text x="600" y="202" text-anchor="middle"
        font-family="Arial Black, DejaVu Sans, sans-serif"
        font-size="105" font-weight="900" letter-spacing="2"
        fill="url(#steel)" stroke="#07162e" stroke-width="14" paint-order="stroke"
        filter="url(#shadow)">OVER ENGINEERED</text>
  <text x="600" y="196" text-anchor="middle"
        font-family="Arial Black, DejaVu Sans, sans-serif"
        font-size="105" font-weight="900" letter-spacing="2"
        fill="url(#steel)" stroke="#e3b62c" stroke-width="4" paint-order="stroke">OVER ENGINEERED</text>

  <!-- nameplate -->
  <g filter="url(#shadow)">
    <rect x="380" y="244" width="440" height="68" rx="24" fill="url(#steel)" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="410" cy="278" r="11" fill="url(#gold)" stroke="#624000" stroke-width="3"/>
    <circle cx="790" cy="278" r="11" fill="url(#gold)" stroke="#624000" stroke-width="3"/>
    <path d="M435 278h55M710 278h55" stroke="#0a326d" stroke-width="4"/>
    <text x="600" y="291" text-anchor="middle"
          font-family="DejaVu Sans Mono, Consolas, monospace"
          font-size="42" font-weight="700" fill="#0a326d">seabass-bridge</text>
  </g>
</svg>
